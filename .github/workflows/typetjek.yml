# Typetjekker pakken for sig. Appene typetjekker den også, når de bygger,
# men en fejl skal helst fanges her, før et tag sættes.
name: Typetjek

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typetjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
